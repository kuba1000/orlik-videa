<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orlík – Videa & Fotky</title>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;}
    html, body {height:100%;}
    body {background:#f8f9fa;font-family:Segoe UI,sans-serif;display:flex;flex-direction:column;}
    .container {display:flex;flex:1;max-width:1400px;margin:20px auto;width:100%;gap:20px;height:calc(100vh - 40px);}
    .sidebar {width:250px;background:#0077cc;border-radius:20px;padding:30px 20px;box-shadow:0 8px 20px rgba(0,119,204,0.3);display:flex;flex-direction:column;}
    .sidebar h2 {color:white;text-align:center;margin-bottom:40px;font-size:1.8rem;}
    .nav-pills {display:flex;flex-direction:column;gap:15px;}
    .nav-pills a {padding:16px 20px;border-radius:50px;text-align:center;font-weight:bold;font-size:1.2rem;transition:all .3s;}
    .nav-pills a.fotky {background:white;color:#0077cc;}
    .nav-pills a.videa {background:transparent;color:white;border:2px solid white;}
    .nav-pills a:hover {transform:scale(1.05);box-shadow:0 6px 15px rgba(0,0,0,0.2);}
    .nav-pills a.active {background:white !important;color:#0077cc !important;}
    .main-content {flex:1;background:white;border-radius:20px;padding:30px;box-shadow:0 8px 20px rgba(0,0,0,0.1);overflow-y:auto;}
    .title {font-size:2rem;color:#0077cc;text-align:center;margin-bottom:30px;font-weight:bold;}
    .grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px;}
    .item {background:white;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.1);transition:transform .3s;}
    .item:hover {transform:translateY(-5px);}
    video, img {width:100%;height:auto;display:block;background:#eee;}
    video {height:200px;object-fit:cover;}
    .caption {padding:12px;text-align:center;font-weight:bold;color:#0077cc;font-size:1.1rem;}
    .tab-content > div {display:none;}
    .tab-content > .active {display:block;}
    .qr {text-align:center;margin:50px 0 30px;}
    .qr img {width:180px;height:180px;border-radius:15px;box-shadow:0 6px 15px rgba(0,119,204,0.3);}
    .update {text-align:center;color:#666;font-size:0.9rem;}
    @media (max-width:900px) {.container {flex-direction:column;height:auto;}.sidebar {width:100%;border-radius:15px;}.nav-pills {flex-direction:row;justify-content:center;}}
    @media (max-width:600px) {.grid {gap:15px;} video {height:160px;} .title {font-size:1.6rem;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Orlík</h2>
      <div class="nav-pills">
        <a href="#" class="fotky active" onclick="showTab('fotky')">Fotky</a>
        <a href="#" class="videa" onclick="showTab('videa')">Videa</a>
      </div>
    </div>

    <div class="main-content">
      <h1 class="title">Orlík – Videa & Fotky</h1>

      <div class="tab-content">
        <div id="fotky" class="active">
          <div class="grid">
            <div class="item">
              <img src="obrazek1.png" alt="Obrázek 1 – Orlík" loading="lazy">
              <div class="caption">Obrázek 1</div>
            </div>
            <div class="item">
              <img src="obrazek2.png" alt="Obrázek 2 – Orlík" loading="lazy">
              <div class="caption">Obrázek 2</div>
            </div>
          </div>
        </div>

        <div id="videa">
          <div class="grid">
            <div class="item">
              <video controls preload="metadata">
                <source src="video1.mp4" type="video/mp4">
                Váš prohlížeč nepodporuje video.
              </video>
              <div class="caption">Video 1</div>
            </div>
            <div class="item">
              <video controls preload="metadata">
                <source src="video2.mp4" type="video/mp4">
                Váš prohlížeč nepodporuje video.
              </video>
              <div class="caption">Video 2</div>
            </div>
          </div>
        </div>
      </div>

      <div class="qr">
        <p><strong>Naskenuj QR kód a otevři stránku na mobilu:</strong></p>
        <img src="qr_videa.png" alt="QR kód">
      </div>
      <div class="update">Aktualizováno: 2025-12-19 08:24</div>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.tab-content > div').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.nav-pills a').forEach(a => a.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      document.querySelector(`.nav-pills a.${tab}`).classList.add('active');
      event.preventDefault();
    }
  </script>
</body>
</html>
