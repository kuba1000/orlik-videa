[20:33, 1. 1. 2026] Jakub Vašek: <!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orlík – 3D Model, Videa & Fotky</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #f8f9fa; font-family: "Segoe UI", sans-serif; display: flex; flex-direction: column; }
    .container { display: flex; flex: 1; max-width: 1400px; margin: 20px auto; width: 100%; gap: 20px; height: calc(100vh - 40px); }

    /* Boční panel */
    .sidebar { width: 250px; background: #0077cc; border-radius: 20px; padding: 30px 20px; box-shadow: 0 8px 20px rgba(0,119,204,0.3); display: flex; flex-direction: column; }
    .sidebar h2 { color: white; text-align: center; margin-bottom: 40px; font-size: 1.8rem; }
    .nav-pills { display: flex; flex-direction: column; gap: 15px; }
    .nav-pills a { padding: 16px 20px; border-radius: 50px; text-align: center; font-weight: bold; font-size: 1.2rem; transition: all .3s; background: white; color: #0077cc; text-decoration: none; }
    .nav-pills a:hover { transform: scale(1.05); }
    .nav-pills a.active { background: #0077cc !important; color: white !important; }

    /* Hlavní obsah */
    .main { flex: 1; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow-y: auto; position: relative; }
    .title { font-size: 2rem; color: #0077cc; text-align: center; margin-bottom: 30px; }

    .section { display: none; position: relative; }
    .section.active { display: block; }

    /* 3D Model */
    .model-section { position: relative; }
    .wave-top, .wave-bottom { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, #0077cc 0%, transparent 70%); border-radius: 50%; opacity: 0.15; z-index: 0; }
    .wave-top { top: -100px; left: -100px; }
    .wave-bottom { bottom: -100px; right: -100px; transform: rotate(180deg); }
    .model-container { position: relative; width: 100%; max-width: 700px; height: 500px; background: #0077cc; border-radius: 20px; overflow: hidden; margin: 0 auto; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
    model-viewer { width: 100%; height: 100%; }
    .placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.6rem; z-index: 1; }

    /* Grid pro videa a fotky */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .item { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); transition: transform .3s; }
    .item:hover { transform: translateY(-5px); }
    video, img { width: 100%; height: auto; display: block; background: #eee; }
    video { height: 200px; object-fit: cover; }
    .caption { padding: 12px; text-align: center; font-weight: bold; color: #0077cc; font-size: 1.1rem; }

    .qr { text-align: center; margin: 50px 0; }
    .qr img { width: 180px; height: 180px; border-radius: 15px; box-shadow: 0 6px 15px rgba(0,119,204,0.3); }
    .update { text-align: center; color: #666; font-size: 0.9rem; }

    /* Responsivita */
    @media (max-width: 900px) {
      .container { flex-direction: column; height: auto; }
      .sidebar { width: 100%; border-radius: 15px; padding: 20px; }
      .nav-pills { flex-direction: row; justify-content: center; }
      .nav-pills a { font-size: 1.1rem; padding: 12px 20px; }
    }
    @media (max-width: 600px) {
      .grid { gap: 15px; }
      video { height: 200px; }
      .model-container { height: 350px; }
      .title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Orlík</h2>
      <div class="nav-pills">
        <a href="#" class="active" onclick="show('model')">3D Model</a>
        <a href="#" onclick="show('videa')">Videa</a>
        <a href="#" onclick="show('fotky')">Fotky</a>
      </div>
    </div>

    <div class="main">
      <h1 class="title"></h1>

      <!-- 3D Model -->
      <div id="model" class="section active model-section">
        <div class="wave-top"></div>
        <div class="wave-bottom"></div>
        <div class="model-container">
          <model-viewer src="model.glb" alt="3D model Orlík" auto-rotate camera-controls ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1.5" exposure="1" environment-image="neutral"></model-viewer>
          <div class="placeholder">Načítám 3D model Orlíku...</div>
        </div>
      </div>

      <!-- Videa -->
      <div id="videa" class="section">
        <div class="grid">
          <div class="item">
            <video controls preload="metadata">
              <source src="video1.mp4" type="video/mp4">
              Váš prohlížeč nepodporuje video.
            </video>
            <div class="caption">Simulace1_povodňového-stavu</div>
          </div>
          <div class="item">
            <video controls preload="metadata">
              <source src="video2.mp4" type="video/mp4">
              Váš prohlížeč nepodporuje video.
            </video>
            <div class="caption">Simulace2_povodňového-stavu</div>
          </div>
        </div>
      </div>

      <!-- Fotky -->
      <div id="fotky" class="section">
        <div class="grid">
          <div class="item">
            <img src="obrazek1.png" alt="půdorys" loading="lazy">
            <div class="caption">půdorys</div>
          </div>
          <div class="item">
            <img src="obrazek2.png" alt="řez" loading="lazy">
            <div class="caption">řez</div>
          </div>
        </div>
      </div>

      <div class="qr">
        <p><strong>Naskenuj QR kód a otevři na mobilu:</strong></p>
        <img src="qr.png" alt="QR kód">
      </div>
      <div class="update">Aktualizováno: 2025-12-20 00:58</div>
    </div>
  </div>

  <script>
    function show(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-pills a').forEach(a => a.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelector(.nav-pills a[onclick="show('${id}')"]).classList.add('active');
    }

    // Skrytí placeholderu po načtení modelu
    const viewer = document.querySelector('model-viewer');
    const placeholder = document.querySelector('.placeholder');
    if (viewer && placeholder) {
      viewer.addEventListener('load', () => placeholder.style.display = 'none');
      viewer.addEventListener('error', () => {
        placeholder.textContent = 'Chyba načítání modelu';
        placeholder.style.color = '#ff6666';
      });
    }
  </script>
</body>
</html>
